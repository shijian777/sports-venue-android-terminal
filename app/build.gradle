plugins {
    id 'com.android.application'
}

android {
    namespace 'com.codex.lockertest'
    compileSdk 34

    defaultConfig {
        applicationId 'com.codex.lockertest'
        minSdk 21
        targetSdk 30
        versionCode 21
        versionName "21.0-frontend-integration-test"

        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }

        testInstrumentationRunner 'android.test.InstrumentationTestRunner'
    }

    flavorDimensions 'faceVerification'
    productFlavors {
        localDemo {
            dimension 'faceVerification'
        }
        production {
            dimension 'faceVerification'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }
}

dependencies {
    implementation files('libs/FaceSDK_8.5_20241220-release.aar')
    localDemoImplementation files('libs/JXPalm-release-2.2.17_RK356x_build3.aar')
    testImplementation 'junit:junit:4.13.2'
}
